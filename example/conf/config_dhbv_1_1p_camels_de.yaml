# dHBV 1.1p trained on CAMELS-DE (1,347 catchments, 1980-01-02 .. 2020-12-31).
#
# Train window: 1980/01/02 .. 2010/12/31 (first 365 d per minibatch are warm-up)
# Test  window: 2010/01/01 .. 2020/12/31 (first year warm-up, scored 2011-2020)
#
# Comparison targets:
#   - LSTM-DE (Bashyal & Song et al. 2026):  median KGE 0.833
#   - Calibrated HBV (CAMELS-DE supplied):    median KGE ~0.68

defaults:
  - _self_
  - hydra: settings
  - observations: camels_de

name: ${model.nn.name}-${model.phy.name}dd


## General -------------------------------#
mode: train  # train, test, train_test, sim

seed: 111111
cache_states: False
device: cuda
gpu_id: 0

data_loader: HydroLoader
data_sampler: HydroSampler
trainer: Trainer

output_dir: ./example_dhbv11p_camels_de
model_dir: ./example_dhbv11p_camels_de/model


## Training ------------------------------#
train:
  start_time: 1980/01/02
  end_time: 2010/12/31
  target: [streamflow]
  optimizer:
    name: Adadelta
  lr: 1.0
  lr_scheduler:
    name: none
    step_size: 10
    gamma: 0.5
  loss_function:
    name: NseBatchLoss

  batch_size: 100
  epochs: 100
  start_epoch: 0
  save_epoch: 5


## Evaluation -------------------------------#
test:
  start_time: 2010/01/01
  end_time: 2020/12/31
  batch_size: 25
  test_epoch: 50


## Inference -------------------------------#
sim:
  start_time: 2010/01/01
  end_time: 2020/12/31
  batch_size: 25


## Differentiable Model -----------------------------#
model:
  rho: 365
  warmup: 365
  use_log_norm: []
  output_unit: mm/d

  phy:
    name: [Hbv_1_1p]
    nmul: 16
    warmup_states: False
    dy_drop: 0.0
    dynamic_params:
      Hbv_1_1p: [parBETA, parK0, parBETAET]

    routing: True
    nearzero: 1e-5

    forcings: [
      prcp,
      tmean,
      pet,
    ]
    attributes: []

  nn:
    name: CudnnLstmModel  # LstmModel for CPU
    dropout: 0.5
    hidden_size: 256

    forcings: [
      prcp,
      tmean,
      pet,
    ]
    attributes: [
      p_mean,
      pet_mean,
      aridity,
      p_seasonality,
      frac_snow,
      high_prec_freq,
      high_prec_dur,
      low_prec_freq,
      low_prec_dur,
      elev_mean,
      area_gages2,
      frac_forest,
      sand_frac,
      silt_frac,
      clay_frac,
    ]
